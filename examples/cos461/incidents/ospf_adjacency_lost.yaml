apiVersion: twinet.dev/v1
kind: Scenario
metadata:
  name: ospf_adjacency_lost
  description: >
    A single OSPF adjacency has been removed inside one AS. Traffic still
    reaches its destination, but over a longer path, so the symptom is latency
    rather than an outage. The agent must localise the missing adjacency.

# What the agent is told. It must describe the observation, never the cause.
brief: >
  Users in AS 3 report that traffic between the eastern and western sites has
  become noticeably slower since this morning. Nothing is unreachable.

seed: 461

# Where the fault goes is drawn when the episode runs, not written here.
#
# This file is published. A scenario that named the device and the interface
# would be the answer, and an agent that had read the repository -- or been
# trained on it -- would score full marks without looking at the network. The
# run picks one internal link inside AS 3 and records the seed it used, so the
# episode is reproducible afterwards without being predictable beforehand.
faults:
  - type: ospf_neighbor_missing
    select:
      kind: internal_link
      as: [3]
