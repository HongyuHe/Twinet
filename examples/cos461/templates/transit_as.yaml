apiVersion: twinet.dev/v1
kind: ASTemplate
metadata:
  name: transit_as
  description: >
    A reduced, staff-operated transit AS. It has a single router carrying every
    external port, which keeps the resource cost of the backdrop ASes low while
    still presenting a realistic BGP neighbour to the students. This mirrors the
    mini-Internet's l3_routers_tier1_and_stub.txt simplification.

routers:
  # COS-461 submissions are FRR command files, so BIRD is intentionally used
  # only on the two staff-operated transit references (AS 1 and AS 2). This
  # exercises mixed-NOS peering without asking a student submission to use
  # syntax the archive format cannot represent.
  ALL:
    id: 1
    nos: bird
    image: hyhe/twinet-bird:0.1

hosts:
  per_router: true
  name: host
  iface: "{{ .Router }}router"

external_ports:
  provider_a: {router: ALL}
  provider_b: {router: ALL}
  customer_a: {router: ALL}
  customer_b: {router: ALL}
  peer_a:     {router: ALL}
  ixp:        {router: ALL}

provisioning:
  provisioned:
    - scope: all
