apiVersion: twinet.dev/v1
kind: Lab
metadata:
  name: demo
  description: A small Twinet lab for smoke tests and development.
  course: COS 461 - Computer Networks, Princeton
  term: fall25

images:
  mode: release
  lock: images.lock.json

defaults:
  cpus: 2
  memory: 512Mi
  pids: 256
  restart: unless-stopped

kinds:
  router:
    image: hyhe/twinet-router:0.1
    requests: {cpus: 0.04, memory: 128Mi, pids: 64, ephemeral_storage: 256Mi, file_descriptors: 1024, netdevs: 8}
    capabilities: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv4.fib_multipath_hash_policy: "1"
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
      net.ipv4.icmp_ratelimit: "0"
  host:
    image: hyhe/twinet-host:0.1
    requests: {cpus: 0.02, memory: 64Mi, pids: 32, ephemeral_storage: 64Mi, file_descriptors: 256, netdevs: 2}
    capabilities: [NET_ADMIN, NET_RAW]
    pids: 128
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "0"
  switch:
    image: hyhe/twinet-switch:0.1
    requests: {cpus: 0.04, memory: 128Mi, pids: 512, ephemeral_storage: 128Mi, file_descriptors: 1024, netdevs: 8}
    capabilities: [NET_ADMIN, NET_RAW, SYS_NICE]
    pids: 512
  service:
    image: hyhe/twinet-svc:0.1
    requests: {cpus: 0.10, memory: 128Mi, pids: 256, ephemeral_storage: 256Mi, file_descriptors: 1024, netdevs: 8}
    capabilities: [NET_ADMIN, NET_RAW]

link_defaults:
  bandwidth: 10mbit
  delay: 10ms
  queue: 50ms
  mtu: 1500

# The addressing plan. This is the single definition of every subnet in the
# lab; the assignment text, the DNS zones, the grader and `twinet solve` all
# read it from here.
addressing:
  as_block:            "{{ .AS }}.0.0.0/8"
  as_block_v6:         "{{ printf \"%x\" .AS }}::/32"
  router_loopback:     "{{ .AS }}.{{ add 150 .RouterID }}.0.1/24"
  router_router:       "{{ .AS }}.0.{{ add 1 .LinkIndex }}.0/24"
  router_host:         "{{ .AS }}.{{ add 100 .RouterID }}.0.0/24"
  # DCS is X.200.0.0/23 and DCN is X.201.0.0/23; each is split into one /24
  # per VLAN, exactly as the assignment text instructs students to do.
  l2_domain:           "{{ .AS }}.{{ add 199 .L2ID }}.0.0/23"
  l2_vlan:             "{{ cidrSubnet (printf \"%d.%d.0.0/23\" .AS (add 199 .L2ID)) .VLANIndex 24 }}"
  l2_domain_v6:        "{{ .AS }}:{{ add 199 .L2ID }}::/32"
  l2_vlan_v6:          "{{ cidrSubnet (printf \"%d:%d::/32\" .AS (add 199 .L2ID)) .VLANIndex 48 }}"
  inter_as:            "{{ cidrSubnet \"179.0.0.0/8\" .LinkIndex 24 }}"
  ixp_peering:         "180.{{ .IXP }}.0.0/24"
  services:
    dns:         "198.{{ .AS }}.0.0/24"
    matrix:      "{{ .AS }}.0.198.0/24"
    measurement: "{{ .AS }}.0.199.0/24"

as_defaults:
  template: student_as
  role: student
  region_of: "r{{ div (sub .AS 1) 8 }}"

autonomous_systems:
  - list: [1]
    template: transit_as
    role: staff
  - range: [2, 3]
    role: student
  - list: [140]
    template: ixp
    role: ixp

peerings:
  generator:
    kind: tiered-internet
    tiers:
      - [1]
      - [2, 3]
    ixps: [140]
    slow_link:
      per_as: 1
      delay: 25ms

services:
  dns:
    kind: builtin.dns
    attach: {template: student_as, router: MSP, iface: dns}
  matrix:
    kind: builtin.matrix
    attach: {template: student_as, router: ATL, iface: matrix}
  measurement:
    kind: builtin.measurement
    attach: {template: student_as, router: HOU, iface: measurement}
  web:
    kind: builtin.web
    listen: ":9000"

access:
  mode: gateway
  listen: ":2022"
  legacy_ports: {enabled: true, base: 2000}

placement:
  strategy: single-node
  # The engine every node of this lab runs on, stated rather than inherited.
  # An omitted selection means Docker for compatibility with manifests older
  # than the runtime registry, which does not deploy on the containerd cluster
  # the operator guide sets up. Run it on Docker or Podman with an explicit
  # override instead of editing the lab: twinet --runtime docker deploy.
  runtime: containerd
  nodes:
    - {name: node-0, underlay_ip: 10.0.1.1, front: true}
