apiVersion: twinet.dev/v1
kind: Rubric
metadata:
  name: cos461-routing
  total: 10
  notes: >
    The Princeton COS-461 routing project. Point values follow the assignment
    wiki: four points for intra-domain routing and six for inter-domain.
    Weights within a question must sum to 1.0, which `twinet grade validate`
    enforces, so a question's point value always means what it says.

questions:
  # ---- Intra-domain routing (4 points) ------------------------------------
  - id: q1.1
    title: Layer-2 connectivity and VLANs
    points: 1
    checks:
      - check: l2.vlan_isolation
        weight: 1.0
        args: {domain: DCS}

  - id: q1.2
    title: IP addressing and OSPF
    points: 1
    converge: true
    checks:
      - check: l3.addressing_matches_plan
        weight: 0.25
      - check: ospf.full_adjacency
        weight: 0.25
      - check: ospf.subnets_advertised
        weight: 0.2
      - check: dataplane.internal_reachability
        weight: 0.2
      # The assignment is explicit that inter-AS ranges must stay out of OSPF;
      # it belongs here rather than as a separate point the marking scheme does
      # not have.
      - check: config.no_forbidden_ospf
        weight: 0.1

  - id: q1.3
    title: OSPF load balancing
    points: 1
    depends_on: [q1.2]
    checks:
      # Exactly the three paths the assignment prescribes, and no others.
      - check: ospf.ecmp_paths
        weight: 1.0
        args:
          a: ATL
          b: BOS
          exclusive: true
          paths:
            - [ATL, BOS]
            - [ATL, PHY, NYC, BOS]
            - [ATL, PHY, BOS]

  - id: q1.4
    title: IPv6 addressing and 6in4 tunnels
    points: 1
    depends_on: [q1.2]
    checks:
      - check: tunnel.sixin4
        weight: 1.0

  # ---- Inter-domain routing (6 points) ------------------------------------
  - id: q2.1
    title: iBGP full mesh
    points: 0.5
    depends_on: [q1.2]
    converge: true
    checks:
      - check: bgp.ibgp_full_mesh
        weight: 1.0

  - id: q2.2
    title: eBGP sessions and prefix advertisement
    points: 0.5
    depends_on: [q2.1]
    checks:
      - check: bgp.ebgp_established
        weight: 0.5
      - check: bgp.own_prefix_only
        weight: 0.5

  - id: q2.3
    title: Business relationships
    points: 2
    depends_on: [q2.2]
    converge: true
    checks:
      - check: policy.gao_rexford
        weight: 0.4
      - check: policy.no_transit_for_peers
        weight: 0.3
      - check: policy.transit_for_customers
        weight: 0.3

  - id: q2.4
    title: Peering through an internet exchange
    points: 1
    depends_on: [q2.3]
    checks:
      - check: policy.ixp_communities
        weight: 1.0

  - id: q2.5
    title: Traffic engineering around the slow links
    points: 1
    depends_on: [q2.3]
    checks:
      - check: policy.traffic_engineering
        weight: 1.0

  - id: q2.6
    title: RPKI and route origin validation
    points: 1
    depends_on: [q2.2]
    checks:
      - check: rpki.invalid_rejected
        weight: 0.6
      - check: rpki.notfound_preserved
        weight: 0.4
