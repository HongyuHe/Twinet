name: CI

# On main only.
#
# main is where a release lands, and a release is the thing an outside user
# takes; it is worth a hosted runner's verdict. Development happens on `dev`,
# which moves faster than a hosted runner is useful for and where `make ci`
# already runs the same gates -- build, vet, race tests, golangci-lint including
# its config verification, shellcheck, the naming check and manifest validation
# -- before every commit. Running the same checks twice on every intermediate
# commit buys nothing and delays the ones that matter.
#
# A pull request into main is also built, because that is the last point at
# which a merge can be stopped.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Kept in one place so the toolchain, the linter and go.mod cannot drift.
  GO_VERSION: "1.25"
  # Pinned rather than "latest".
  #
  # golangci-lint refuses to run when the Go version it was built with is older
  # than the module's target, so "latest" silently broke CI the moment the
  # module moved to Go 1.25 while the action still resolved a v1.x binary built
  # with Go 1.24. Pinning makes that a deliberate, visible upgrade.
  GOLANGCI_VERSION: "v2.5.0"

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Verify the module is tidy
        run: |
          cp go.mod go.mod.bak && cp go.sum go.sum.bak
          go mod tidy
          if ! diff -q go.mod go.mod.bak >/dev/null || ! diff -q go.sum go.sum.bak >/dev/null; then
            echo "go.mod or go.sum is not tidy; run 'go mod tidy'"; exit 1
          fi
          rm -f go.mod.bak go.sum.bak

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build content-addressed release identity
        run: make release-build

      - name: Validate the bundled labs
        run: |
          for lab in examples/*/; do
            ./bin/twinet validate -m "$lab"
          done

      - name: Check that every bundled lab shares one runtime contract
        run: |
          # Six of seven labs once defaulted to Docker while the documented
          # cluster ran containerd, so the bundle could not be deployed as a
          # set anywhere. Each lab declares the cluster runtime, and each must
          # still validate under an explicit override for a Docker or Podman
          # machine.
          for lab in examples/*/; do
            grep -Eq '^[[:space:]]*runtime:[[:space:]]*containerd[[:space:]]*$' "$lab/twinet.yaml" || {
              echo "$lab/twinet.yaml does not declare placement.runtime: containerd" >&2
              exit 1
            }
            ./bin/twinet --runtime docker validate -m "$lab" >/dev/null
            ./bin/twinet --runtime podman validate -m "$lab" >/dev/null
          done

      - name: Validate the bundled rubrics
        run: |
          for rubric in examples/*/rubric/*.yaml; do
            ./bin/twinet grade validate "$rubric"
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_VERSION }}
          args: --timeout=5m

  images:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build container images
        run: make images

  o12-runtime-isolation:
    name: O12 Docker isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Prove router and FRR sidecar isolation
        env:
          TWINET_O12_INTEGRATION_ALLOW_DESTRUCTIVE: "1"
        run: make o12-integration

  shell:
    name: Shell scripts and conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh
          bash scripts/test_release_runners.sh
      - name: Check naming conventions
        run: ./scripts/check_naming.sh
