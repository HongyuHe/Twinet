name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Kept in one place so the toolchain, the linter and go.mod cannot drift.
  GO_VERSION: "1.25"
  # Pinned rather than "latest".
  #
  # golangci-lint refuses to run when the Go version it was built with is older
  # than the module's target, so "latest" silently broke CI the moment the
  # module moved to Go 1.25 while the action still resolved a v1.x binary built
  # with Go 1.24. Pinning makes that a deliberate, visible upgrade.
  GOLANGCI_VERSION: "v2.5.0"

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Verify the module is tidy
        run: |
          cp go.mod go.mod.bak && cp go.sum go.sum.bak
          go mod tidy
          if ! diff -q go.mod go.mod.bak >/dev/null || ! diff -q go.sum go.sum.bak >/dev/null; then
            echo "go.mod or go.sum is not tidy; run 'go mod tidy'"; exit 1
          fi
          rm -f go.mod.bak go.sum.bak

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: make build

      - name: Validate the bundled labs
        run: |
          ./bin/twinet validate -m examples/demo
          ./bin/twinet validate -m examples/cos461

      - name: Validate the bundled rubric
        run: ./bin/twinet grade validate examples/cos461/rubric/cos461.yaml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_VERSION }}
          args: --timeout=5m

  images:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build container images
        run: make images

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh
